# Render configuration for DineIQ Backend
# This file tells Render how to build and run your FastAPI application

services:
  - type: web
    name: dineiq-backend
    runtime: python
    plan: free  # Change to 'starter' or higher for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      # Add your environment variables in Render dashboard:
      # - SPREADSHEET_ID
      # - GEMINI_API_KEY
      # - GEMINI_CHAT_LLM_INFERENCE_ENABLED
      # - GEMINI_DIETARY_LLM_INFERENCE_ENABLED
      # - SENDGRID_API_KEY
      # - TWILIO_ACCOUNT_SID
      # - TWILIO_AUTH_TOKEN
      # - TWILIO_PHONE_NUMBER
      # - STRIPE_SECRET_KEY
      # - JWT_SECRET_KEY
      # - And any other secrets from your .env file
